<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>투표 시스템 체인코드 테스터</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.6/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // FunctionForm 컴포넌트
    function FunctionForm({ functionName, fields, onSubmit }) {
      const [formData, setFormData] = useState({});

      const handleInputChange = (e) => {
        setFormData({ ...formData, [e.target.name]: e.target.value });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const args = fields.map((field) => formData[field.name] || '');
        onSubmit(functionName, args);
      };

      const functionLabels = {
        initLedger: '원장 초기화',
        registerCandidate: '후보자 등록',
        registerVoter: '유권자 등록',
        vote: '투표',
        endVoting: '투표 종료',
        getVotingResults: '투표 결과 조회',
        getVoterInfo: '유권자 정보 조회',
        getCandidateInfo: '후보자 정보 조회',
      };

      return (
        <form onSubmit={handleSubmit} className="space-y-4">
          <h3 className="text-lg font-semibold">{functionLabels[functionName]}</h3>
          {fields.map((field) => (
            <div key={field.name}>
              <label className="block text-sm font-medium text-gray-700">
                {field.label}
              </label>
              <input
                type="text"
                name={field.name}
                value={formData[field.name] || ''}
                onChange={handleInputChange}
                className="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
                placeholder={field.placeholder}
              />
            </div>
          ))}
          <button
            type="submit"
            className="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700"
          >
            실행
          </button>
        </form>
      );
    }

    // ResultDisplay 컴포넌트
    function ResultDisplay({ result, error }) {
      if (!result && !error) return null;

      return (
        <div className="mt-6 p-4 bg-gray-100 rounded-md">
          {result && (
            <>
              <h3 className="text-lg font-semibold text-green-600">결과</h3>
              <pre className="mt-2 text-sm text-gray-800">
                {JSON.stringify(result, null, 2)}
              </pre>
            </>
          )}
          {error && (
            <>
              <h3 className="text-lg font-semibold text-red-600">오류</h3>
              <p className="mt-2 text-sm text-red-800">{error}</p>
            </>
          )}
        </div>
      );
    }

    // 메인 App 컴포넌트
    function App() {
      const [activeFunction, setActiveFunction] = useState('initLedger');
      const [result, setResult] = useState(null);
      const [error, setError] = useState(null);

      const functionConfigs = {
        initLedger: { fields: [], endpoint: '/invoke' },
        registerCandidate: {
          fields: [
            { name: 'candidateId', label: '후보자 ID', placeholder: '예: candidate1' },
            { name: 'name', label: '후보자 이름', placeholder: '예: 홍길동' },
          ],
          endpoint: '/invoke',
        },
        registerVoter: {
          fields: [
            { name: 'voterId', label: '유권자 ID', placeholder: '예: voter1' },
            { name: 'name', label: '유권자 이름', placeholder: '예: 김영희' },
          ],
          endpoint: '/invoke',
        },
        vote: {
          fields: [
            { name: 'voterId', label: '유권자 ID', placeholder: '예: voter1' },
            { name: 'candidateId', label: '후보자 ID', placeholder: '예: candidate1' },
          ],
          endpoint: '/invoke',
        },
        endVoting: { fields: [], endpoint: '/invoke' },
        getVotingResults: { fields: [], endpoint: '/query' },
        getVoterInfo: {
          fields: [{ name: 'voterId', label: '유권자 ID', placeholder: '예: voter1' }],
          endpoint: '/query',
        },
        getCandidateInfo: {
          fields: [
            { name: 'candidateId', label: '후보자 ID', placeholder: '예: candidate1' },
          ],
          endpoint: '/query',
        },
      };

      const functionLabels = {
        initLedger: '원장 초기화',
        registerCandidate: '후보자 등록',
        registerVoter: '유권자 등록',
        vote: '투표',
        endVoting: '투표 종료',
        getVotingResults: '투표 결과 조회',
        getVoterInfo: '유권자 정보 조회',
        getCandidateInfo: '후보자 정보 조회',
      };

      const handleFunctionCall = async (functionName, args) => {
        setResult(null);
        setError(null);
        const config = functionConfigs[functionName];
        try {
          const response = await axios.post(`http://localhost:3000${config.endpoint}`, {
            function: functionName,
            args,
          });
          setResult(response.data);
        } catch (err) {
          setError(err.response?.data?.error || 'API 호출 중 오류가 발생했습니다.');
        }
      };

      return (
        <div className="flex min-h-screen bg-gray-50">
          {/* 사이드바 */}
          <div className="w-64 bg-indigo-800 text-white p-6">
            <h2 className="text-2xl font-bold mb-6">투표 시스템 테스터</h2>
            <ul className="space-y-2">
              {Object.keys(functionConfigs).map((func) => (
                <li key={func}>
                  <button
                    onClick={() => setActiveFunction(func)}
                    className={`w-full text-left px-4 py-2 rounded-md ${
                      activeFunction === func ? 'bg-indigo-600' : 'hover:bg-indigo-700'
                    }`}
                  >
                    {functionLabels[func]}
                  </button>
                </li>
              ))}
            </ul>
          </div>
          {/* 메인 콘텐츠 */}
          <div className="flex-1 p-8">
            <h1 className="text-3xl font-bold mb-8">체인코드 함수 테스터</h1>
            <FunctionForm
              functionName={activeFunction}
              fields={functionConfigs[activeFunction].fields}
              onSubmit={handleFunctionCall}
            />
            <ResultDisplay result={result} error={error} />
          </div>
        </div>
      );
    }

    // App 렌더링
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
